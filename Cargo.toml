[package]
name = "translate-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[[bin]]
name = "translate"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ureq = { version = "3.4.2", features = ["json"] }

[dev-dependencies]
httpmock = "0.8.3"
